services:
  drupal:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-funiber_portal}_drupal
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      - DB_NAME=${DB_NAME:-drupal11}
      - DB_USER=${DB_USER:-drupal}
      - DB_PASSWORD=${DB_PASSWORD:-drupal_secret_pass}
      - DB_HOST=${DB_HOST:-database}
      - DB_PORT=${DB_PORT:-3306}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - funiber_network

  webserver:
    image: nginx:1.25-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-funiber_portal}_nginx
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - drupal
    networks:
      - funiber_network

  database:
    image: mariadb:10.11
    container_name: ${COMPOSE_PROJECT_NAME:-funiber_portal}_mariadb
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_NAME:-drupal11}
      MYSQL_USER: ${DB_USER:-drupal}
      MYSQL_PASSWORD: ${DB_PASSWORD:-drupal_secret_pass}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret_pass}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "${DB_USER:-drupal}", "-p${DB_PASSWORD:-drupal_secret_pass}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - funiber_network

networks:
  funiber_network:
    driver: bridge

volumes:
  db_data:
    driver: local
